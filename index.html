<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Members</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #0f172a;
  color: white;
}

/* Header */
header {
  padding: 20px;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
}

/* Search */
.search {
  text-align: center;
  margin-bottom: 20px;
}
.search input {
  padding: 10px;
  width: 80%;
  max-width: 400px;
  border-radius: 10px;
  border: none;
}

/* Grid */
.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  padding: 20px;
}

/* Card */
.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  transition: 0.3s;
  cursor: pointer;
}
.card:hover {
  transform: translateY(-5px);
}

.card img {
  width: 80px;
  border-radius: 50%;
}

.card h3 {
  margin: 10px 0 5px;
}

.card p {
  font-size: 14px;
  color: #cbd5f5;
}

/* Profile Popup */
.profile {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  display: none;
  justify-content: center;
  align-items: center;
}

.profile-card {
  background: #1e293b;
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  width: 300px;
}

.profile-card img {
  width: 100px;
  border-radius: 50%;
}

.close {
  margin-top: 15px;
  background: red;
  border: none;
  padding: 8px 15px;
  border-radius: 10px;
  color: white;
}
</style>
</head>

<body>

<header>Cobalt Member List</header>

<div class="search">
  <input type="text" id="search" placeholder="ค้นหาชื่อ...">
</div>

<div class="container" id="members"></div>

<!-- Popup -->
<div class="profile-card">
  <img id="p-img">
  <h2 id="p-name"></h2>
  <p id="p-bio"></p>

  <a id="p-link" href="#" target="_blank">
    <button style="
      margin-top:10px;
      padding:8px 15px;
      border:none;
      border-radius:10px;
      background:#3b82f6;
      color:white;
      cursor:pointer;
    ">
      Profile
    </button>
  </a>

  <button class="close" onclick="closeProfile()">ปิด</button>
</div>

<script>
  const data = [
  {
    name:"Lurq Cobalt",
    bio:"Founder",
    img:"https://img2.pic.in.th/unknown.png",
    link:"https://www.facebook.com/lurq.cobalt" // ใส่ลิงก์จริง
  },
  {
    name:"Luft Cobalt",
    bio:"Leader",
    img:"https://img2.pic.in.th/unknown.png",
    link:"https://www.facebook.com/luftcobalt/"
  }
];
  
const container = document.getElementById("members");

function render(list) {
  container.innerHTML = "";
  list.forEach(user => {
    container.innerHTML += `
      <div class="card" onclick="openProfile('${user.name}','${user.bio}','${user.img}')">
        <img src="${user.img}">
        <h3>${user.name}</h3>
        <p>${user.bio}</p>
      </div>
    `;
  });
}

render(data);

function openProfile(name,bio,img){
  document.getElementById("profile").style.display="flex";
  document.getElementById("p-name").innerText=name;
  document.getElementById("p-bio").innerText=bio;
  document.getElementById("p-img").src=img;
}

function closeProfile(){
  document.getElementById("profile").style.display="none";
}

document.getElementById("search").addEventListener("input", e => {
  const value = e.target.value.toLowerCase();
  const filtered = data.filter(u => u.name.toLowerCase().includes(value));
  render(filtered);
});
</script>

</body>
</html>
